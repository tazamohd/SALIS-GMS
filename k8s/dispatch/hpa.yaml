# Sane default only — this is the first extracted service, not a service
# under real production load yet. Revisit thresholds once real traffic data
# exists (see .claude/skills/kubernetes-specialist/references/cost-optimization.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dispatch
  namespace: salis-dispatch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dispatch
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
