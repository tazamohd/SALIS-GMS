apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-sa
  namespace: salis-dispatch
---
# Dispatch doesn't talk to the Kubernetes API at all today — this Role grants
# nothing beyond read access to its own ConfigMap, purely so the service
# account exists and is never defaulted. Tighten further (remove entirely)
# if that read is not actually needed once a config-reload pattern is chosen.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatch-role
  namespace: salis-dispatch
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["dispatch-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatch-rolebinding
  namespace: salis-dispatch
subjects:
  - kind: ServiceAccount
    name: dispatch-sa
    namespace: salis-dispatch
roleRef:
  kind: Role
  name: dispatch-role
  apiGroup: rbac.authorization.k8s.io
