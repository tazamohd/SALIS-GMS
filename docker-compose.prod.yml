# Production deploy: TLS-terminated, backed-up, health-checked.
#
#   1. cp .env.example .env   — set SESSION_SECRET, POSTGRES_PASSWORD, DOMAIN
#      (DOMAIN must already point at this host for Let's Encrypt issuance)
#   2. docker compose -f docker-compose.prod.yml up --build -d
#
# Caddy terminates HTTPS with automatic Let's Encrypt certificates and
# proxies to the app; Postgres is internal-only; a sidecar dumps the
# database nightly and keeps 14 days of compressed backups in a volume.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: salis
    volumes:
      - salis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salis"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/salis
      NODE_ENV: production
      # Behind Caddy's HTTPS the session cookie must be Secure-only.
      SESSION_COOKIE_SECURE: "true"
      PORT: "5000"
    healthcheck:
      # node:20-slim ships no curl/wget — probe with node's global fetch.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    command: caddy reverse-proxy --from ${DOMAIN} --to app:5000
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - salis_backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          ts=$$(date -u +%Y%m%d-%H%M%S)
          pg_dump -h db -U postgres -d salis -F c -f "/backups/salis-$$ts.dump" \
            && echo "backup ok: salis-$$ts.dump" \
            || echo "backup FAILED at $$ts"
          # Keep 14 days of nightly dumps.
          find /backups -name 'salis-*.dump' -mtime +14 -delete
          sleep 86400
        done

volumes:
  salis_pgdata:
  salis_backups:
  caddy_data:
  caddy_config:
