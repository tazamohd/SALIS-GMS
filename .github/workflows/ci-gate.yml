name: Build, Lint & Test

on:
  push:
    branches: [main, dev, pr-branch]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salis_gms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salis_gms_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salis_gms_test
      SESSION_SECRET: ci-test-secret-not-used-for-anything-real-just-needs-to-exist
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit 2>&1 | grep -v "tsconfig.json" || true

      - name: Push Drizzle schema
        run: npx drizzle-kit push --force

      - name: Run tests
        run: npm test
