name: SalisAuto GMS CI Pipeline

on:
  push:
    branches: [ main, dev, pr-branch ]
  pull_request:
    branches: [ main, pr-branch ]

jobs:
  build-and-lint:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        # See .github/workflows/test.yml for why npm install (not ci).
        run: npm install --no-audit --no-fund

      - name: Type Check (TypeScript Compiler)
        run: npm run check

      - name: Run ESLint
        run: npm run lint

      - name: Production Build (Vite + esbuild)
        run: npm run build

    # Tests run in test.yml against a real Postgres 16 service.
