# One-command demo/self-host deploy: `docker compose up --build`
# Then open http://localhost:5000  (demo login password: Demo123!)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: salis
      POSTGRES_DB: salis
    ports:
      - "5432:5432"
    volumes:
      - salis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salis"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:salis@db:5432/salis
      # Replace with a real 32+ char secret for anything non-demo.
      SESSION_SECRET: change-me-to-a-32-plus-character-demo-secret-0001
      NODE_ENV: production
      # HTTP demo over localhost — session cookie must NOT be Secure-only.
      # Remove this (or set "true") behind real HTTPS.
      SESSION_COOKIE_SECURE: "false"
      DEMO_MODE: "true"
      PORT: "5000"
    ports:
      - "5000:5000"

volumes:
  salis_pgdata:
