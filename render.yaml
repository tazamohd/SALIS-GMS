services:
  - type: web
    name: salis-gms
    runtime: node
    buildCommand: npm ci && npm run build && npx drizzle-kit push --force
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: salis-gms-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: "5000"
databases:
  - name: salis-gms-db
    plan: free
